; =====================================================================
; Smart Rider HMI - ESP32 Firmware PlatformIO Configuration
; Target: ESP32-WROOM-32 / ESP32 Dev Module
; Framework: Arduino / C++
; =====================================================================

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    ; NimBLE-Arduino offers 50% less RAM/Flash footprint than standard ESP32 BLE
    h2zero/NimBLE-Arduino @ ^1.4.1

monitor_filters = 
    esp32_exception_decoder
    time
